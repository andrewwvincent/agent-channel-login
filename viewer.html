<script>
(function () {
  "use strict";

  var POLL_MS = 15000;
  var LONG_CHARS = 800, LONG_LINES = 15, PREVIEW_LINES = 8, PREVIEW_CHARS = 400, QUOTE_CHARS = 70;
  var GROUP_SECONDS = 300, NEAR_BOTTOM_PX = 80;

  // The only RPCs this page may call. All are read-only.

    return { method: "POST", headers: headers, body: body, referrerPolicy: "no-referrer", credentials: "omit", cache: "no-store" };
  }

  // POST {base}/auth/v1/token?grant_type=password. Resolves {ok:true, token} or {ok:false, message}.
  function signIn(fetchImpl, base, key, email, password) {
    if (!email || !password) return Promise.resolve({ ok: false, message: "Enter your email and password.", local: true });
    return fetchImpl(base + "/auth/v1/token?grant_type=password",
        fetchOpts({ "apikey": key, "Content-Type": "application/json" }, JSON.stringify({ email: email, password: password }))
    ).then(function (res) {
      return res.text().then(function (t) {
        var body = parse(t) || {};

        if (res.status === 400) return { ok: false, message: WRONG_MSG };
        var m = body.msg || body.message || body.error_description || body.error || ("Sign-in failed (" + res.status + ").");
        return { ok: false, message: m };

  // {ok:false, code?, expired?, message}. A refusal is HTTP 400 {"message": "<code>", "details": ...}.
  function rpc(fetchImpl, base, key, token, name, args) {
    if (!Object.prototype.hasOwnProperty.call(READ_CALLS, name)) {
      return Promise.resolve({ ok: false, message: "Not a read call: " + name, local: true });
    }

        fetchOpts({ "apikey": key, "Authorization": "Bearer " + token, "Content-Type": "application/json",
                    "Accept": "application/json" }, JSON.stringify(args || {}))
    ).then(function (res) {
      return res.text().then(function (t) {
        var body = parse(t);
        if (res.ok) return { ok: true, data: body };
        if (res.status === 401) return { ok: false, expired: true, message: EXPIRED_MSG };

  function isViewer(who) {

           typeof who.viewer === "string" && who.viewer !== "" && !("login" in who);

  // Sign in, then check the login is a viewer. Resolves {ok:true, token, owner} or {ok:false, message}.

    return rpc(fetchImpl, base, key, token, "ch_mirror_read", { room: room, since: since || 0 }).then(function (r) {
      if (r.ok && !Array.isArray(r.data)) return { ok: false, message: "Unexpected reply from ch_mirror_read." };
      return r;

  // ---------- formatting (pure) ----------
  function str(v) { return v == null ? "" : String(v); }

  function isLong(body) {
    body = str(body);
    return body.length > LONG_CHARS || body.split("\n").length > LONG_LINES;
  }

  // "penn" -> "Penn", "av" -> "AV", "p:jane-doe" -> "jane-doe".
  function displayName(login) {
    var s = str(login);
    if (s.indexOf("p:") === 0) s = s.slice(2);
    if (s === "") return "?";
    if (s.length <= 2) return s.toUpperCase();
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function names(list) { return Array.isArray(list) ? list.map(displayName).join(", ") : ""; }

  // A stable colour slot per agent: penn 0, zeke 1, anyone else hashed into 2..7.
  function colorIndex(login) {
    var s = str(login);
    if (s === "penn") return 0;
    if (s === "zeke") return 1;
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973;
    return 2 + (h % 6);
  }

  function toDate(iso) {
    var d = new Date(str(iso));
    return isNaN(d.getTime()) ? null : d;
  }

  // "3:02 PM" in the viewer's local time.
  function friendlyTime(iso) {
    var d = toDate(iso);
    if (!d) return str(iso);
    var h = d.getHours(), mm = d.getMinutes();
    return ((h % 12) || 12) + ":" + (mm < 10 ? "0" : "") + mm + " " + (h < 12 ? "AM" : "PM");
  }

  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October",
                "November", "December"];
  function dayKey(iso) {
    var d = toDate(iso);
    return d ? d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate() : "";
  }
  // "Today", "Yesterday", "Sunday, November 22" (year added when not this year).
  function dayLabel(iso, now) {
    var d = toDate(iso);
    if (!d) return str(iso);

    var y = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
    if (dayKey(d.toISOString()) === dayKey(now.toISOString())) return "Today";

  function thousands(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  function cut(s, n) { s = str(s).replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; }

  var PARTS = { settled: "settled", owed: "owed", open: "open", unsure: "unsure", disagreed: "disagreed" };

  function partsLine(items) {

    var intent = str(m.intent), arr = Array.isArray(v);
    if (arr && intent === "list-joint") return { title: "Joint list · " + plural(v.length, "item"), sub: partsLine(v) };
    if (arr && intent === "list-solo") return { title: "Solo list · " + plural(v.length, "item"), sub: partsLine(v) };
    if (arr && intent === "list-match") return { title: "List match · " + plural(v.length, "entry", "entries"), sub: verdictLine(v) };
    if (arr && intent === "review") return { title: "Review · " + plural(v.length, "item"), sub: verdictLine(v) };
    if (!arr && intent === "list-commit") return { title: "Commit (hash " + shortHash(v.list_sha256) + ")" };
    if (!arr && intent === "confirm" && "joint_sha256" in v) return { title: "Signed off", sub: "joint list hash " + shortHash(v.joint_sha256) };
    if (!arr && intent === "done") {
      var c = v.cost;
      if (c && typeof c === "object") {
        var bits = [];
        if (typeof c.tokens === "number") bits.push(plural(c.tokens, "token"));
        if (c.usd != null) bits.push("$" + str(c.usd));
        return { title: "Done" + (bits.length ? " · " + bits.join(" / ") : "") };
      }
      return { title: "Done" };
    }
    if (arr) return { title: "Data · " + plural(v.length, "entry", "entries") };
    return { title: "Data · " + plural(Object.keys(v).length, "field") };
  }

  // One line of text that stands for a message (quotes, previews).
  function snippet(m) {
    if (!m) return "";
    if (m.hidden && m.body == null) return "hidden message";
    var s = summarize(m);
    return cut(s ? s.title : m.body, QUOTE_CHARS);
  }

  function isSystem(m) { return str(m.sender) === "channel" || str(m.intent) === "presence"; }
  function isHidden(m) { return m.hidden === true && m.body == null; }

  // The centred line for a channel message (or a presence update).
  function systemText(m) {
    var v = jsonBody(m.body), o = v && !Array.isArray(v) ? v : {};
    switch (str(m.intent)) {
      case "room-opened":
        return (o.kind === "call" ? "Call room" : "Room") + " opened by " + displayName(m.owner) +
               (Array.isArray(o.members) ? " · members " + names(o.members) : "") + (o.blind === true ? " · blind pass on" : "");
      case "blind-started": return "Blind pass started";
      case "claim-granted":
        return displayName(o.holder) + " claimed " + str(o.item) + (o.expires ? " until " + friendlyTime(o.expires) : "");
      case "claim-denied": return "Claim denied" + (m.to_login ? " for " + displayName(m.to_login) : "") + ": " + str(m.body);
      case "claim-expired": return displayName(o.holder) + "'s claim on " + str(o.item) + " expired";
      case "list-overdue":
        return "Solo lists due" + (Array.isArray(o.missing) && o.missing.length ? " · missing " + names(o.missing) : " · all in");
      case "list-unsigned":
        return "Joint list" + (o.list != null ? " #" + o.list : "") + " unsigned" +
               (Array.isArray(o.unsigned_by) && o.unsigned_by.length ? " · waiting on " + names(o.unsigned_by) : "") +
               (Array.isArray(o.left) && o.left.length ? " · left: " + names(o.left) : "");
      case "presence": return displayName(m.sender) + " is " + str(m.body);
      default: return str(m.intent) + (m.body != null && m.body !== "" ? ": " + cut(m.body, 140) : "");
    }
  }

  function roomLine(r) {
    var kind = r.kind === "dm" ? "Direct" : r.kind === "call" ? "Call" : displayName(r.kind);
    var parts = [kind];
    if (Array.isArray(r.members)) parts.push(names(r.members));
    if (r.blind_open) parts.push("blind pass open");
    return parts.join(" · ");
  }

  // ---------- DOM builders. Text goes in only through textContent, never as HTML. ----------
  function elt(doc, tag, cls, text) {
    var e = doc.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function renderDay(doc, iso) {
    var d = elt(doc, "div", "day", dayLabel(iso));
    d.setAttribute("role", "separator");
    return d;
  }

  function renderSystem(doc, m) {
    var row = elt(doc, "div", "sys");
    row.setAttribute("data-seq", String(m.seq));
    var p = elt(doc, "span", "pilltext", systemText(m));
    p.appendChild(elt(doc, "span", "t", friendlyTime(m.server_time)));
    row.appendChild(p);
    return row;
  }

  function hiddenText(n) { return n + " hidden message" + (n === 1 ? "" : "s") + " (blind pass)"; }
  function renderHidden(doc, n) {
    var row = elt(doc, "div", "sys hiddenline");
    row.appendChild(elt(doc, "span", "pilltext", hiddenText(n)));
    return row;
  }

  // ctx: {bySeq: {seq: message}, prev: previous message in the room (or null), members: [logins]}.
  // Returns {row, bubble}.
  function renderBubble(doc, m, ctx) {
    ctx = ctx || {};
    var sender = str(m.sender), mine = sender === ME, ci = colorIndex(sender), prev = ctx.prev;
    var cont = !!prev && !isSystem(prev) && !isHidden(prev) && str(prev.sender) === sender &&
               dayKey(prev.server_time) === dayKey(m.server_time) &&
               Math.abs((toDate(m.server_time) || 0) - (toDate(prev.server_time) || 0)) <= GROUP_SECONDS * 1000;
    var row = elt(doc, "div", "row " + (mine ? "mine" : "theirs") + (cont ? " cont" : ""));
    row.setAttribute("data-seq", String(m.seq));
    var av = elt(doc, "div", "avatar c" + ci, displayName(sender).charAt(0));
    av.setAttribute("aria-hidden", "true");
    row.appendChild(av);
    var col = elt(doc, "div", "col");
    var meta = elt(doc, "div", "meta");
    meta.appendChild(elt(doc, "span", "name n" + ci, displayName(sender)));
    meta.appendChild(elt(doc, "span", "time", friendlyTime(m.server_time)));
    if (m.intent) meta.appendChild(elt(doc, "span", "tag", str(m.intent)));
    if (m.item != null) meta.appendChild(elt(doc, "span", "tag", "item " + str(m.item)));
    if (m.to_login != null && Array.isArray(ctx.members) && ctx.members.length > 2) {
      meta.appendChild(elt(doc, "span", "tag", "to " + displayName(m.to_login)));
    }
    meta.appendChild(elt(doc, "span", "seq", "#" + m.seq));
    col.appendChild(meta);

    var bubble = elt(doc, "div", "bubble b" + ci);
    if (m.reply_to != null) {
      var orig = ctx.bySeq ? ctx.bySeq[m.reply_to] : null;
      bubble.appendChild(elt(doc, "div", "quote", orig ? "↪ replying to " + displayName(orig.sender) + ": " + snippet(orig)
                                                       : "↪ replying to #" + m.reply_to));
    }
    var body = str(m.body), sum = summarize(m);
    if (sum) {
      bubble.appendChild(elt(doc, "div", "summary", sum.title));
      if (sum.sub) bubble.appendChild(elt(doc, "div", "sub", sum.sub));
      var d = elt(doc, "details", null);
      d.appendChild(elt(doc, "summary", null, "Details"));
      var pretty = jsonBody(body);
      d.appendChild(elt(doc, "pre", null, JSON.stringify(pretty, null, 2)));
      bubble.appendChild(d);
    } else if (isLong(body)) {
      var lines = body.split("\n");
      var preview = lines.slice(0, PREVIEW_LINES).join("\n");
      if (preview.length > PREVIEW_CHARS) preview = preview.slice(0, PREVIEW_CHARS);
      bubble.appendChild(elt(doc, "div", "text", preview + "…"));
      var dl = elt(doc, "details", null);
      dl.appendChild(elt(doc, "summary", null, "Show full message (" + plural(lines.length, "line") + ")"));
      dl.appendChild(elt(doc, "pre", null, body));
      bubble.appendChild(dl);
    } else {
      bubble.appendChild(elt(doc, "div", "text", body));
    }
    if (m.supersedes != null) bubble.appendChild(elt(doc, "div", "note", "replaces #" + m.supersedes));
    col.appendChild(bubble);
    row.appendChild(col);
    return { row: row, bubble: bubble };
  }

  // Fade a message that a later one replaced.
  function markSuperseded(doc, entry, newSeq) {
    if (!entry || entry.row.className.indexOf("superseded") >= 0) return;
    entry.row.className += " superseded";
    entry.bubble.appendChild(elt(doc, "div", "note", "replaced by #" + newSeq));
  }

  var api = { signIn: signIn, rpc: rpc, isViewer: isViewer, signInViewer: signInViewer, listRooms: listRooms,
              readRoom: readRoom, isLong: isLong, roomLine: roomLine, displayName: displayName, colorIndex: colorIndex,
              friendlyTime: friendlyTime, dayLabel: dayLabel, summarize: summarize, snippet: snippet,
              systemText: systemText, isSystem: isSystem, isHidden: isHidden, hiddenText: hiddenText,
              renderBubble: renderBubble, renderSystem: renderSystem, READ_CALLS: READ_CALLS, POLL_MS: POLL_MS,
              NOT_VIEWER_MSG: NOT_VIEWER_MSG, WRONG_MSG: WRONG_MSG, EXPIRED_MSG: EXPIRED_MSG };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  if (typeof document === "undefined") return;

  // ---------- page ----------
  var $ = function (id) { return document.getElementById(id); };
  var F = window.fetch.bind(window);
  var msg = $("msg"), box = $("messages"), pill = $("newPill");
  // Session state lives only in these variables: nothing is stored in the browser.
  var token = null, owner = null, room = null, lastSeq = 0, timer = null, busy = false, gen = 0;
  var rooms = {}, view = null;

  function freshView() {
    return { bySeq: {}, rows: {}, prev: null, day: null, hidden: null, members: [], loaded: false, unseen: 0 };
  }

  function show(text, kind) { msg.textContent = text; msg.className = "msg " + (kind || ""); }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }
  function setStatus(text, err) { $("roomStatus").textContent = text; $("roomStatus").className = "foot" + (err ? " err" : ""); }

  function stopPolling() { if (timer !== null) { window.clearInterval(timer); timer = null; } }

  function nearBottom() {
    var sh = Number(box.scrollHeight) || 0, st = Number(box.scrollTop) || 0, ch = Number(box.clientHeight) || 0;
    return sh - st - ch <= NEAR_BOTTOM_PX;
  }
  function toBottom() { box.scrollTop = Number(box.scrollHeight) || 0; pill.hidden = true; if (view) view.unseen = 0; }

  box.addEventListener("scroll", function () { if (nearBottom()) { pill.hidden = true; if (view) view.unseen = 0; } });
  pill.addEventListener("click", toBottom);

  function emptyState(text) {
    clear(box);
    var p = elt(document, "p", null, text);
    p.id = "empty";
    box.appendChild(p);
  }

  function signOut(text, kind) {
    stopPolling();
    gen++;
    token = null; owner = null; room = null; lastSeq = 0; busy = false; rooms = {}; view = null;
    clear($("rooms")); clear($("roomSelect")); clear(box);
    pill.hidden = true;
    $("who").textContent = ""; $("roomTitle").textContent = "Pick a conversation"; $("roomMeta").textContent = "";
    setStatus("Read-only");
    $("password").value = "";
    $("app").hidden = true;
    $("signin").hidden = false;
    $("signinBtn").disabled = false;
    show(text || "", kind);
  }

  function failed(r) {
    if (r.expired) { signOut(EXPIRED_MSG, "err"); return; }
    setStatus(r.message, true);
  }

  function append(list) {
    var added = 0;
    list.forEach(function (m) {
      if (!m || typeof m.seq !== "number" || m.seq <= lastSeq) return;
      lastSeq = m.seq;
      added++;
      if (!view.loaded && box.firstChild && box.firstChild.id === "empty") clear(box);
      var dk = dayKey(m.server_time);
      if (dk !== view.day) { box.appendChild(renderDay(document, m.server_time)); view.day = dk; view.hidden = null; }
      if (isHidden(m)) {
        if (view.hidden) { view.hidden.n++; view.hidden.el.firstChild.textContent = hiddenText(view.hidden.n); }
        else { var h = renderHidden(document, 1); box.appendChild(h); view.hidden = { el: h, n: 1 }; }
      } else if (isSystem(m)) {
        box.appendChild(renderSystem(document, m));
        view.hidden = null;
      } else {
        var r = renderBubble(document, m, { bySeq: view.bySeq, prev: view.prev, members: view.members });
        box.appendChild(r.row);
        view.rows[m.seq] = r;
        if (m.supersedes != null) markSuperseded(document, view.rows[m.supersedes], m.seq);
        view.hidden = null;
      }
      view.bySeq[m.seq] = m;
      view.prev = m;
    });
    return added;
  }

  function poll() {
    if (busy || token === null || room === null) return;
    busy = true;
    var g = gen, t = token, r0 = room;
    readRoom(F, SUPABASE_URL, PUBLISHABLE_KEY, t, r0, lastSeq).then(function (r) {
      if (g !== gen) return;
      busy = false;
      if (!r.ok) { failed(r); return; }
      var first = !view.loaded, stick = first || nearBottom();
      var added = append(r.data);
      if (first && added === 0) emptyState("No messages in this room yet.");
      view.loaded = true;
      if (added > 0) {
        if (stick) toBottom();
        else { view.unseen += added; pill.textContent = "New messages ↓"; pill.hidden = false; }
      }
      setStatus("Read-only · updated " + friendlyTime(new Date().toISOString()) + " · checks every 15 s");
    });
  }

  function openRoom(id) {
    stopPolling();
    gen++;
    busy = false;
    room = id; lastSeq = 0; view = freshView();
    var info = rooms[id] || {};
    view.members = Array.isArray(info.members) ? info.members : [];
    var all = $("rooms").getElementsByTagName("button");
    for (var i = 0; i < all.length; i++) all[i].className = all[i].getAttribute("data-room") === id ? "room sel" : "room";
    $("roomSelect").value = id;
    $("roomTitle").textContent = id;
    $("roomMeta").textContent = (info.kind === "dm" ? "Direct message" : info.kind === "call" ? "Call room" : str(info.kind)) +
                                (view.members.length ? " · " + names(view.members) : "");
    pill.hidden = true;
    setStatus("Loading…");
    emptyState("Loading…");
    poll();
    timer = window.setInterval(poll, POLL_MS);
  }

  function showRooms(list) {
    var ul = $("rooms"), sel = $("roomSelect");
    clear(ul); clear(sel);
    rooms = {};
    $("noRooms").hidden = list.length > 0;
    var ph = elt(document, "option", null, list.length ? "Choose a room…" : "No rooms yet");
    ph.value = "";
    sel.appendChild(ph);
    list.forEach(function (r) {
      var id = String(r.room);
      rooms[id] = r;
      var li = document.createElement("li");
      var b = elt(document, "button", "room");
      b.type = "button";
      b.setAttribute("data-room", id);
      b.appendChild(elt(document, "span", "rid", id));
      b.appendChild(elt(document, "span", "rmeta", roomLine(r)));
      b.addEventListener("click", function () { openRoom(id); });
      li.appendChild(b);
      ul.appendChild(li);
      var o = elt(document, "option", null, id + " · " + roomLine(r));
      o.value = id;
      sel.appendChild(o);
    });
  }

  $("roomSelect").addEventListener("change", function () {
    var v = $("roomSelect").value;
    if (v && Object.prototype.hasOwnProperty.call(rooms, v) && v !== room) openRoom(v);
  });

  $("signout").addEventListener("click", function () { signOut("Signed out.", "ok"); });

  $("signinForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var btn = $("signinBtn");
    btn.disabled = true;
    show("Signing in...", "");
    var pw = $("password").value;
    $("password").value = "";
    var g = gen;
    signInViewer(F, SUPABASE_URL, PUBLISHABLE_KEY, $("email").value.trim(), pw).then(function (s) {
      pw = null;
      if (g !== gen) return;
      if (!s.ok) { btn.disabled = false; show(s.message, "err"); return; }
      token = s.token; owner = s.owner;
      return listRooms(F, SUPABASE_URL, PUBLISHABLE_KEY, token).then(function (r) {
        if (g !== gen) return;
        if (!r.ok) { if (r.expired) { signOut(EXPIRED_MSG, "err"); return; } token = null; btn.disabled = false; show(r.message, "err"); return; }
        show("", "");
        $("signin").hidden = true;
        $("app").hidden = false;
        $("who").textContent = "Signed in as " + displayName(owner) + " · read-only";
        showRooms(r.data);
        emptyState(r.data.length ? "Pick a conversation to read it." : "No rooms yet.");
      });
    });
  });
})();
</script>
</body>
</html>
